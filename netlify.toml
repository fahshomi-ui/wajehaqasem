# Static site in /public + one Netlify Function (netlify/functions/links.mjs).
# Required environment variable on Netlify: ADMIN_PASSWORD (password for /admin).
[build]
  publish = "public"
  functions = "netlify/functions"
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "DENY"
    Cache-Control = "no-store"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800"
